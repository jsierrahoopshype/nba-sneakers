name: Daily Photo Update

on:
  schedule:
    # Daily at 8am UTC (9am Madrid, 3am ET)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch photos and generate site
        env:
          IMAGN_USERNAME: ${{ secrets.IMAGN_USERNAME }}
          IMAGN_PASSWORD: ${{ secrets.IMAGN_PASSWORD }}
          IMAGN_SESSION: ${{ secrets.IMAGN_SESSION }}
        run: |
          cd scripts
          python fetch_imagn.py
          python generate_site.py

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily photo update - $(date +%Y-%m-%d)"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
